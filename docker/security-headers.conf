# Security headers. Styles are injected inline by styled-components, so
# style-src needs 'unsafe-inline'; there is no inline script usage.
#
# nginx only inherits add_header from the server block into a location block
# if that location has no add_header of its own — so this file is included
# both at the server level and in every location that sets its own
# Cache-Control (= /index.html, /assets/), otherwise those responses lose
# all headers below.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'" always;
