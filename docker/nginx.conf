server {
  listen 93;

  gzip on;
  gzip_vary on;
  gzip_min_length 512;
  gzip_types text/plain text/css application/json application/javascript text/javascript
             application/xml text/xml image/svg+xml font/ttf font/woff font/woff2;

  include /etc/nginx/security-headers.conf;

  # Root location that provides all files of the website.
  location / {
    root   /usr/share/nginx/html;
    index  index.html;
    try_files $uri @rewrites;
  }

  # index.html must always be revalidated so deploys are picked up immediately.
  location = /index.html {
    root   /usr/share/nginx/html;
    add_header Cache-Control "no-cache";
    include /etc/nginx/security-headers.conf;
  }

  # Vite fingerprints build assets (e.g. index-a1b2c3.js), so they can be
  # cached aggressively and immutably.
  location /assets/ {
    root   /usr/share/nginx/html;
    add_header Cache-Control "public, max-age=31536000, immutable";
    include /etc/nginx/security-headers.conf;
  }

  # Rewrite all locations to the website.
  location @rewrites {
    rewrite ^(.+)$ /index.html last;
  }

  error_page 500 502 503 504 /50x.html;
  location = /50x.html {
    root   /usr/share/nginx/html;
  }

}
