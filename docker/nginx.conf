server {
  listen 93;

  gzip on;
  gzip_vary on;
  gzip_min_length 512;
  gzip_types text/plain text/css application/json application/javascript text/javascript
             application/xml text/xml image/svg+xml font/ttf font/woff font/woff2;

  # Security headers. Styles are injected inline by styled-components, so
  # style-src needs 'unsafe-inline'; there is no inline script usage.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'" always;

  # Root location that provides all files of the alimonia website.
  location / {
    root   /usr/share/nginx/html;
    index  index.html;
    try_files $uri @rewrites;
  }

  # index.html must always be revalidated so deploys are picked up immediately.
  location = /index.html {
    root   /usr/share/nginx/html;
    add_header Cache-Control "no-cache";
  }

  # Vite fingerprints build assets (e.g. index-a1b2c3.js), so they can be
  # cached aggressively and immutably.
  location /assets/ {
    root   /usr/share/nginx/html;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Rewrite all locations to the alimonia website.
  location @rewrites {
    rewrite ^(.+)$ /index.html last;
  }

  error_page 500 502 503 504 /50x.html;
  location = /50x.html {
    root   /usr/share/nginx/html;
  }

}
