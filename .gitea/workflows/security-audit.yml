name: Security Audit

on:
    schedule:
        - cron: '0 6 * * 1' # every Monday, 06:00 UTC
    workflow_dispatch:

permissions:
    contents: read

jobs:
    bun-audit:
        runs-on: ubuntu-latest
        outputs:
            found: ${{ steps.audit.outputs.found }}
            summary: ${{ steps.audit.outputs.summary }}
        steps:
            - name: Checkout repository
              uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
              with:
                  persist-credentials: false

            - name: Setup Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Run bun audit
              id: audit
              run: |
                  set +e
                  OUTPUT=$(bun audit 2>&1)
                  EXIT_CODE=$?
                  set -e
                  echo "$OUTPUT"

                  DELIM="EOF_$(openssl rand -hex 8)"
                  {
                      echo "summary<<$DELIM"
                      echo "$OUTPUT"
                      echo "$DELIM"
                  } >> "$GITHUB_OUTPUT"

                  if [ "$EXIT_CODE" -ne 0 ]; then
                      echo "found=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "found=false" >> "$GITHUB_OUTPUT"
                  fi

    # Scans the actual Dockerfile stages (built locally, not the raw upstream
    # tags) for known OS/package CVEs - so fixes baked into the Dockerfile
    # itself (e.g. an `apk upgrade` layer) are reflected, not just "is a newer
    # tag available".
    docker-images:
        runs-on: ubuntu-latest
        outputs:
            found: ${{ steps.scan.outputs.found }}
            summary: ${{ steps.scan.outputs.summary }}
        steps:
            - name: Checkout repository
              uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
              with:
                  persist-credentials: false

            - name: Install Trivy
              run: |
                  curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/v0.72.0/contrib/install.sh \
                      | sh -s -- -b /usr/local/bin v0.72.0

            # Builds every stage so the scan reflects what actually gets
            # produced (e.g. an `apk upgrade` in the final stage) instead of
            # the pristine upstream base image.
            - name: Build stages
              shell: bash
              run: |
                  STAGES=$(grep -oP '^FROM \S+ AS \K\S+' docker/Dockerfile || true)
                  for STAGE in $STAGES; do
                      docker build -f docker/Dockerfile --target "$STAGE" -t "audit-stage-${STAGE}:local" .
                  done
                  docker build -f docker/Dockerfile -t audit-stage-final:local .

            # Only the last FROM in the Dockerfile is what actually ships (the
            # earlier stages are build-only and never leave the runner), so
            # findings there are always reported but don't gate `found` -
            # they can't reach production and don't warrant a ticket alone.
            - name: Scan built images
              id: scan
              shell: bash
              run: |
                  set +e
                  FOUND=false
                  REPORT=""
                  FROM_LINES=$(grep -E '^FROM ' docker/Dockerfile)
                  LAST_LINE=$(echo "$FROM_LINES" | tail -n1)

                  while IFS= read -r LINE; do
                      [ -z "$LINE" ] && continue
                      BASE=$(echo "$LINE" | awk '{print $2}')
                      STAGE=$(echo "$LINE" | grep -oP ' AS \K\S+' || true)

                      if [ "$LINE" = "$LAST_LINE" ]; then
                          TAG="audit-stage-final:local"
                          LABEL="$BASE"
                          IS_FINAL=true
                      elif [ -n "$STAGE" ]; then
                          TAG="audit-stage-${STAGE}:local"
                          LABEL="$BASE (Build-Stage, wird nicht ausgeliefert)"
                          IS_FINAL=false
                      else
                          continue
                      fi

                      IMAGE_REPORT=$(trivy image --severity CRITICAL,HIGH --exit-code 1 --format table --quiet "$TAG" 2>&1)
                      IMAGE_EXIT=$?
                      if [ "$IMAGE_EXIT" -ne 0 ]; then
                          if [ "$IS_FINAL" = true ]; then
                              FOUND=true
                          fi
                          REPORT="$REPORT
                  ## $LABEL
                  $IMAGE_REPORT
                  "
                      fi
                  done <<< "$FROM_LINES"
                  set -e

                  echo "$REPORT"

                  DELIM="EOF_$(openssl rand -hex 8)"
                  {
                      echo "summary<<$DELIM"
                      echo "$REPORT"
                      echo "$DELIM"
                  } >> "$GITHUB_OUTPUT"
                  echo "found=$FOUND" >> "$GITHUB_OUTPUT"

    # Statically checks the workflow files themselves for security issues, e.g.
    # unpinned/floating action refs (the tj-actions supply-chain incident is
    # exactly the class of bug this catches) rather than just version drift.
    workflow-actions:
        runs-on: ubuntu-latest
        outputs:
            found: ${{ steps.zizmor.outputs.found }}
            summary: ${{ steps.zizmor.outputs.summary }}
        steps:
            - name: Checkout repository
              uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
              with:
                  persist-credentials: false

            # Installed from the prebuilt release binary (checksum-verified)
            # instead of pip, since the runner's system Python is externally
            # managed (PEP 668) and rejects unscoped `pip install`.
            - name: Install zizmor
              run: |
                  cd /tmp
                  ARCHIVE="zizmor-x86_64-unknown-linux-gnu.tar.gz"
                  curl -sfLO "https://github.com/zizmorcore/zizmor/releases/download/v1.27.0/${ARCHIVE}"
                  echo "277f2bd8fd37cf60c42ab7afca6faa884e65440fa31e02b44bdaae60f62a358f  ${ARCHIVE}" | sha256sum -c -
                  tar -xzf "$ARCHIVE"
                  mkdir -p "$HOME/.local/bin"
                  install -m 755 zizmor "$HOME/.local/bin/zizmor"
                  echo "$HOME/.local/bin" >> "$GITHUB_PATH"

            - name: Run zizmor
              id: zizmor
              run: |
                  set +e
                  TARGETS=""
                  [ -d .gitea/workflows ] && TARGETS="$TARGETS .gitea/workflows"
                  [ -d .github/workflows ] && TARGETS="$TARGETS .github/workflows"
                  OUTPUT=$(zizmor --color=never --no-online-audits $TARGETS 2>&1)
                  EXIT_CODE=$?
                  set -e
                  echo "$OUTPUT"

                  DELIM="EOF_$(openssl rand -hex 8)"
                  {
                      echo "summary<<$DELIM"
                      echo "$OUTPUT"
                      echo "$DELIM"
                  } >> "$GITHUB_OUTPUT"

                  # 0 = clean, 11-14 = findings (severity-graded), everything else
                  # is a tool/usage error and should fail the job loudly instead of
                  # being reported as a (non-existent) security finding.
                  if [ "$EXIT_CODE" -eq 0 ]; then
                      echo "found=false" >> "$GITHUB_OUTPUT"
                  elif [ "$EXIT_CODE" -ge 11 ] && [ "$EXIT_CODE" -le 14 ]; then
                      echo "found=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "zizmor failed with exit code $EXIT_CODE" >&2
                      exit "$EXIT_CODE"
                  fi

    # Opens (or updates) a single tracking issue instead of spamming a new one
    # per run. Needs the repo's Actions setting "Read and write permissions"
    # enabled so the built-in token can create issues.
    report:
        needs: [bun-audit, docker-images, workflow-actions]
        if: |
            always() && (
              needs.bun-audit.outputs.found == 'true' ||
              needs.docker-images.outputs.found == 'true' ||
              needs.workflow-actions.outputs.found == 'true'
            )
        runs-on: ubuntu-latest
        permissions:
            issues: write
        steps:
            - name: Create or update security issue
              env:
                  GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
                  API_URL: ${{ gitea.api_url }}
                  REPO: ${{ gitea.repository }}
                  RUN_URL: ${{ gitea.server_url }}/${{ gitea.repository }}/actions/runs/${{ gitea.run_id }}
                  BUN_FOUND: ${{ needs.bun-audit.outputs.found }}
                  BUN_SUMMARY: ${{ needs.bun-audit.outputs.summary }}
                  DOCKER_FOUND: ${{ needs.docker-images.outputs.found }}
                  DOCKER_SUMMARY: ${{ needs.docker-images.outputs.summary }}
                  ACTIONS_FOUND: ${{ needs.workflow-actions.outputs.found }}
                  ACTIONS_SUMMARY: ${{ needs.workflow-actions.outputs.summary }}
              run: |
                  TITLE="Security Audit: offene Funde"

                  BODY="Automatisch erkannte Sicherheitsfunde vom $(date -u +'%Y-%m-%d %H:%M UTC') ([Lauf]($RUN_URL))."

                  if [ "$BUN_FOUND" = "true" ]; then
                      BODY="$BODY

                  ### bun audit (App-Abhängigkeiten)
                  \`\`\`
                  $BUN_SUMMARY
                  \`\`\`"
                  fi

                  if [ "$DOCKER_FOUND" = "true" ]; then
                      BODY="$BODY

                  ### Docker-Basisimages (Trivy, CRITICAL/HIGH)
                  \`\`\`
                  $DOCKER_SUMMARY
                  \`\`\`"
                  fi

                  if [ "$ACTIONS_FOUND" = "true" ]; then
                      BODY="$BODY

                  ### Workflow-Actions (zizmor)
                  \`\`\`
                  $ACTIONS_SUMMARY
                  \`\`\`"
                  fi

                  EXISTING=$(curl -s -H "Authorization: token $GITEA_TOKEN" \
                      "$API_URL/repos/$REPO/issues?state=open&type=issues&limit=50" \
                      | jq -r --arg t "$TITLE" '[.[] | select(.title == $t)] | .[0].number // empty')

                  if [ -n "$EXISTING" ]; then
                      echo "Updating issue #$EXISTING"
                      jq -n --arg body "$BODY" '{body: $body}' \
                          | curl -s -X PATCH -H "Authorization: token $GITEA_TOKEN" -H "Content-Type: application/json" \
                              "$API_URL/repos/$REPO/issues/$EXISTING" -d @-
                      jq -n --arg body "**Neuer Scan mit offenen Funden:**

                  $BODY" '{body: $body}' \
                          | curl -s -X POST -H "Authorization: token $GITEA_TOKEN" -H "Content-Type: application/json" \
                              "$API_URL/repos/$REPO/issues/$EXISTING/comments" -d @-
                  else
                      echo "Creating new issue"
                      jq -n --arg title "$TITLE" --arg body "$BODY" '{title: $title, body: $body}' \
                          | curl -s -X POST -H "Authorization: token $GITEA_TOKEN" -H "Content-Type: application/json" \
                              "$API_URL/repos/$REPO/issues" -d @-
                  fi
